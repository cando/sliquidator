[package]
name = "sliquidator"
version = "0.1.0"
edition = "2021"
license = "MIT"


[dependencies]
# Alloy for Ethereum types, contracts, and providers
alloy = { version = "^1.0.9", features = ["full"] }

# Asynchronous runtime
tokio = { version = "1.45.1", features = ["full"] }
futures = "0.3.31"
futures-util = "0.3.31"
tokio-util = "0.7.15"


# HTTP client for Odos quoting
reqwest = { version = "0.12.20", features = [
    "json",
    "gzip",
    "rustls-tls",
    "stream",
] }

# JSON handling for API payloads
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
serde_with = "3.13.0"

# Hex decoding for Odos response data
hex = "0.4.3"

# Timestamps and formatting
chrono = { version = "0.4.41", features = ["serde"] }

# Error handling
eyre = "0.6.12"

# Logging
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
rpassword = "7.4.0"
tracing-appender = "0.2.3"

# Command-line argument parsing
clap = { version = "4.5.40", features = ["derive"] }
clap_derive = "4.5.40"

# Lazy
once_cell = "1.21.3"
